name: Deploy GitHub to server

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: kf-github-to-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy only changed files to the live server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify this is a complete website checkout
        run: |
          set -euo pipefail
          if [ ! -f index.php ]; then
            echo "Deployment stopped safely: index.php is missing from main."
            echo "No FTP connection or server changes were made."
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy only added, modified and deleted files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          export FTP_PORT="${FTP_PORT:-21}"

          python3 - <<'PY'
          import os
          import posixpath
          import subprocess

          excluded = (
              ".git", ".github", ".env", "docs", "data", "cache",
              "img", "uploads", "logs", "tmp", "ai-backups",
              ".ftp-deploy-sync-state.json",
          )

          def is_excluded(path):
              return any(path == item or path.startswith(item + "/") for item in excluded)

          def q(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit("FTP paths and settings must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          before = os.environ["BEFORE_SHA"]
          after = os.environ["AFTER_SHA"]
          if not before or set(before) == {"0"}:
              raise SystemExit("Cannot safely determine changed files: missing previous commit SHA")

          raw = subprocess.check_output([
              "git", "diff", "--name-status", "-z", "--find-renames",
              before, after,
          ])
          fields = raw.decode("utf-8", errors="surrogateescape").split("\0")
          remote_root = os.environ["FTP_REMOTE_DIR"].rstrip("/")
          uploads = []
          deletions = []
          i = 0

          while i < len(fields) and fields[i]:
              status = fields[i]
              i += 1
              if status.startswith(("R", "C")):
                  old_path, new_path = fields[i], fields[i + 1]
                  i += 2
                  if status.startswith("R") and not is_excluded(old_path):
                      deletions.append(old_path)
                  if not is_excluded(new_path):
                      uploads.append(new_path)
              else:
                  path = fields[i]
                  i += 1
                  if is_excluded(path):
                      continue
                  if status == "D":
                      deletions.append(path)
                  else:
                      uploads.append(path)

          # Keep ordering deterministic and avoid duplicate FTP operations.
          uploads = sorted(set(uploads))
          deletions = sorted(set(deletions))

          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              "set ftp:passive-mode yes",
              f"open -p {q(os.environ['FTP_PORT'])} {q(os.environ['FTP_SERVER'])}",
              f"user {q(os.environ['FTP_USERNAME'])} {q(os.environ['FTP_PASSWORD'])}",
          ]

          for path in uploads:
              remote_dir = posixpath.join(remote_root, posixpath.dirname(path))
              remote_dir = remote_dir.rstrip("/")
              commands.append(f"mkdir -p {q(remote_dir)}")
              commands.append(f"put -O {q(remote_dir)} {q(path)}")

          # Remote deletion is performed only for paths explicitly deleted in this Git commit.
          for path in deletions:
              remote_path = posixpath.join(remote_root, path)
              commands.append(f"rm -f {q(remote_path)}")

          commands.append("bye")
          with open("/tmp/kf-deploy.lftp", "w", encoding="utf-8") as f:
              f.write("\n".join(commands) + "\n")

          print(f"Files to upload: {len(uploads)}")
          print(f"Files to delete on server: {len(deletions)}")
          if not uploads and not deletions:
              print("No deployable file changes in this commit.")
          PY

          if grep -qE '^(put|rm -f) ' /tmp/kf-deploy.lftp; then
            lftp -f /tmp/kf-deploy.lftp
          else
            echo "No website files changed; FTP was not contacted."
          fi
          rm -f /tmp/kf-deploy.lftp
