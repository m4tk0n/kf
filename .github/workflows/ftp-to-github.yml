name: Import FTP to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ftp-import
  cancel-in-progress: false

jobs:
  import:
    name: Download FTP and prepare review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download website from FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          FTP_PORT="${FTP_PORT:-21}"

          # Quote values for lftp's command language; credentials are never printed.
          python3 - <<'PY'
          import os
          def q(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit("FTP settings must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          server = q(os.environ["FTP_SERVER"])
          username = q(os.environ["FTP_USERNAME"])
          password = q(os.environ["FTP_PASSWORD"])
          remote = q(os.environ["FTP_REMOTE_DIR"])
          port = q(os.environ.get("FTP_PORT", "21"))

          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              f"open -p {port} {server}",
              f"user {username} {password}",
              # Pull remote files into the checked-out repository. Never import
              # secrets, Git metadata, or the workflow definitions from the server.
              "mirror --verbose --parallel=2 "
              "--exclude-glob .env --exclude-glob '.env.*' "
              "--exclude-glob .git --exclude-glob '.git/**' "
              "--exclude-glob .github --exclude-glob '.github/**' "
              f"{remote} .",
              "bye",
          ]
          with open("/tmp/ftp-import.lftp", "w", encoding="utf-8") as f:
              f.write("\n".join(commands) + "\n")
          PY
          lftp -f /tmp/ftp-import.lftp
          rm -f /tmp/ftp-import.lftp

      - name: Create pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ftp-import
          delete-branch: true
          commit-message: "Import current website files from FTP"
          title: "Import current website files from FTP"
          body: |
            This pull request contains files downloaded from the configured FTP directory.

            Review the changes before merging. The import intentionally excludes:
            - `.env` and `.env.*`
            - `.git` and `.github`

            No files are deleted from the repository by this import.
          add-paths: |
            **
