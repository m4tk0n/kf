name: Import FTP to GitHub
# Incrementally synchronize the live FTP website into main.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ftp-to-github.yml
  schedule:
    # Check the live FTP server regularly; GitHub may start scheduled runs with a delay.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ftp-import
  cancel-in-progress: false

jobs:
  import:
    name: Incrementally synchronize website files from FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download changed files and remove deleted server files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          FTP_PORT="${FTP_PORT:-21}"

          # Quote values for lftp's command language; credentials are never printed.
          python3 - <<'PY'
          import os
          def q(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit("FTP settings must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          server = q(os.environ["FTP_SERVER"])
          username = q(os.environ["FTP_USERNAME"])
          password = q(os.environ["FTP_PASSWORD"])
          remote = q(os.environ["FTP_REMOTE_DIR"])
          port = q(os.environ.get("FTP_PORT", "21"))

          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              f"open -p {port} {server}",
              f"user {username} {password}",
              # Unchanged files stay untouched; new/changed files are downloaded.
              # --delete removes local website files that no longer exist on FTP.
              # Excluded paths are protected from transfer and deletion.
              "mirror --verbose --delete --parallel=2 "
              "--exclude-glob .env --exclude-glob '.env.*' "
              "--exclude-glob .git --exclude-glob '.git/**' "
              "--exclude-glob .github --exclude-glob '.github/**' "
              # Runtime data, uploaded images and cron state belong to the live server.
              "--exclude-glob data --exclude-glob 'data/**' "
              "--exclude-glob img --exclude-glob 'img/**' "
              "--exclude-glob cron --exclude-glob 'cron/**' "
              "--exclude-glob .ftp-deploy-sync-state.json "
              f"{remote} .",
              "bye",
          ]
          with open("/tmp/ftp-import.lftp", "w", encoding="utf-8") as f:
              f.write("\n".join(commands) + "\n")
          PY
          lftp -f /tmp/ftp-import.lftp
          rm -f /tmp/ftp-import.lftp

          # Refuse to replace GitHub with an empty or inaccessible server directory.
          FILE_COUNT="$(find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name '.env' \
            ! -name '.env.*' \
            ! -path './data/*' \
            ! -path './img/*' \
            ! -path './cron/*' \
            | wc -l)"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No website files were downloaded; refusing to commit an empty replacement."
            exit 1
          fi
          echo "Downloaded website contains $FILE_COUNT files."

      - name: Commit FTP copy directly to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep environment files, workflow definitions and deploy state out of this sync.
          git add -A -- . \
            ':(exclude).env' \
            ':(exclude).env/**' \
            ':(exclude).env.*' \
            ':(exclude).env.*/**' \
            ':(exclude).github' \
            ':(exclude).github/**' \
            ':(exclude).ftp-deploy-sync-state.json'

          if git diff --cached --quiet; then
            echo "GitHub and the live FTP server are already in sync."
            exit 0
          fi

          git status --short
          git commit -m "Synchronize website files from live FTP server"
          git push origin HEAD:main
