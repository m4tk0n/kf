name: K&F integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-workflow:
    name: Event submission and moderation (isolated test DB)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      APP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BASE_URL: http://127.0.0.1/_kf/
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: kf_test
      DB_USER: root
      DB_PASS: root
      TABLE_PREFIX: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, gd, mbstring, pdo_mysql
          coverage: none

      - name: Create isolated test environment
        run: |
          cat > .env <<EOF
          APP_ENV=test
          APP_KEY=${APP_KEY}
          BASE_URL=${BASE_URL}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASS=${DB_PASS}
          TABLE_PREFIX=
          EOF

      - name: PHP syntax check
        run: |
          find . -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run event workflow integration tests
        run: php tests/integration/events_workflow.php
