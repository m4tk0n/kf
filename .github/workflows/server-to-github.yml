name: Import server changes to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kf-server-to-github
  cancel-in-progress: false

jobs:
  import:
    name: Import eligible source files from the live server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download source files from FTP without changing the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          export FTP_PORT="${FTP_PORT:-21}"
          mkdir -p /tmp/kf-server-import

          python3 - <<'PY'
          import os

          def q(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit("FTP settings must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          remote = os.environ["FTP_REMOTE_DIR"].rstrip("/") + "/"
          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              "set ftp:passive-mode yes",
              f"open -p {q(os.environ['FTP_PORT'])} {q(os.environ['FTP_SERVER'])}",
              f"user {q(os.environ['FTP_USERNAME'])} {q(os.environ['FTP_PASSWORD'])}",
              # Download only. No server-side write, rename or delete command.
              "mirror --verbose --parallel=2 "
              "--exclude-glob .git --exclude-glob '.git/**' "
              "--exclude-glob .github --exclude-glob '.github/**' "
              "--exclude-glob .env --exclude-glob '.env.*' "
              "--exclude-glob data --exclude-glob 'data/**' "
              "--exclude-glob cache --exclude-glob 'cache/**' "
              "--exclude-glob img --exclude-glob 'img/**' "
              "--exclude-glob uploads --exclude-glob 'uploads/**' "
              "--exclude-glob logs --exclude-glob 'logs/**' "
              "--exclude-glob tmp --exclude-glob 'tmp/**' "
              "--exclude-glob ai-backups --exclude-glob 'ai-backups/**' "
              "--exclude-glob 'ai/copy/**' "
              "--exclude-glob .ftp-deploy-sync-state.json "
              f"{q(remote)} {q('/tmp/kf-server-import')}",
              "bye",
          ]
          with open("/tmp/kf-server-import.lftp", "w", encoding="utf-8") as f:
              f.write("\n".join(commands) + "\n")
          PY

          lftp -f /tmp/kf-server-import.lftp
          rm -f /tmp/kf-server-import.lftp

      - name: Apply server files without deleting GitHub files
        run: |
          set -euo pipefail
          imported=0

          while IFS= read -r -d '' file; do
            relative="${file#/tmp/kf-server-import/}"

            # Defense in depth: only source/documentation text formats are imported.
            case "$relative" in
              .env|.env.*|.git|.git/*|.github|.github/*| \
              data|data/*|cache|cache/*|img|img/*|uploads|uploads/*| \
              logs|logs/*|tmp|tmp/*|ai-backups|ai-backups/*| \
              ai/copy|ai/copy/*|.ftp-deploy-sync-state.json)
                continue
                ;;
            esac

            case "$relative" in
              *.php|*.js|*.css|*.html|*.htm|*.json|*.md|*.txt|*.sql|*.xml|*.svg|*.yml|*.yaml|*.ini|*.htaccess|*.gitignore|*.example)
                ;;
              *)
                continue
                ;;
            esac

            mkdir -p "$(dirname "$relative")"
            cp -- "$file" "$relative"
            git add -- "$relative"
            imported=$((imported + 1))
          done < <(find /tmp/kf-server-import -type f -print0)

          if [ "$imported" -eq 0 ]; then
            echo "No eligible source files were downloaded; nothing to commit."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "Server source files are already identical to GitHub."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "Import source changes from live server"
          git push origin HEAD:main
