name: Read live server through AI Code Viewer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - SERVER-SNAPSHOT.md
  workflow_run:
    workflows:
      - Deploy GitHub to FTP
    types:
      - completed
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: server-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download current files from the live AI Code Viewer
        env:
          SOURCE_URL: https://7x.wz.cz/_kf/ai/
        run: |
          set -euo pipefail
          mkdir -p snapshot
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          base = os.environ["SOURCE_URL"]
          headers = {"User-Agent": "KF-live-server-snapshot/1.0"}
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              return urllib.request.urlopen(request, timeout=45)

          with get(base + "?action=list") as response:
              listing = json.loads(response.read().decode("utf-8"))

          files = listing.get("files")
          if not isinstance(files, list):
              raise SystemExit("The server did not return a valid file list.")
          print(f"Server reports {len(files)} files.")

          root = pathlib.Path("snapshot").resolve()
          downloaded = 0
          skipped = 0
          for item in files:
              relative = item.get("path", "")
              if not isinstance(relative, str) or not relative or "\x00" in relative:
                  skipped += 1
                  continue
              path = pathlib.PurePosixPath(relative)
              parts = path.parts
              if path.is_absolute() or any(part in ("", ".", "..", ".git", ".github", "ai-backups") or part == ".env" or part.startswith(".env.") for part in parts):
                  skipped += 1
                  continue

              url = base + "?action=txt&file=" + urllib.parse.quote(relative, safe="")
              try:
                  with get(url) as response:
                      data = response.read()
              except urllib.error.HTTPError as error:
                  print(f"Skipping {relative}: HTTP {error.code}")
                  skipped += 1
                  continue

              target = (root / pathlib.Path(*parts)).resolve()
              if root not in target.parents:
                  skipped += 1
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              downloaded += 1

          if downloaded == 0:
              raise SystemExit("No server files were downloaded; refusing to publish an empty snapshot.")
          print(f"Downloaded {downloaded} text files; skipped {skipped} files.")
          PY

      - name: Publish snapshot to the separate server-snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin server-snapshot >/dev/null 2>&1; then
            git fetch origin server-snapshot
            git switch -C server-snapshot FETCH_HEAD
            git rm -rf . >/dev/null 2>&1 || true
          else
            git switch --orphan server-snapshot
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp -a snapshot/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Live server snapshot is unchanged."
            exit 0
          fi
          git commit -m "Snapshot live server files"
          git push origin HEAD:server-snapshot
