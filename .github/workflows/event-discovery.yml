name: K&F event discovery

on:
  push:
    branches: [main]
    paths:
      - "Install/seed_priprava/discovery_sources.json"
      - "Install/seed_priprava/automation/discover_events.py"
      - ".github/workflows/event-discovery.yml"
  workflow_dispatch:
    inputs:
      start_year:
        description: First year to scan (newest)
        required: true
        default: "2028"
      end_year:
        description: Last year to scan (oldest)
        required: true
        default: "2024"
      max_pages:
        description: Maximum pages to fetch
        required: true
        default: "250"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: kf-event-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Discover event candidates from all configured sources and known venues
        run: |
          python Install/seed_priprava/automation/discover_events.py \
            --start-year "${{ inputs.start_year || '2028' }}" \
            --end-year "${{ inputs.end_year || '2024' }}" \
            --max-pages "${{ inputs.max_pages || '250' }}"
      - name: Commit discovery queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Install/seed_priprava/discovery_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(seed): refresh punk event discovery candidates"
            git push origin HEAD:main
          else
            echo "No discovery changes."
          fi
