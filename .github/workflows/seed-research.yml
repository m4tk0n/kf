name: K&F – rešerše koncertů (PHP worker)

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: Počet vyhledávacích dotazů v jednom běhu (1–12)
        required: false
        default: "12"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: kf-seed-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, xml
          coverage: none

      - name: Validate PHP worker syntax
        run: php -l seed-worker.php

      - name: Run bounded research batch on the live server
        env:
          AI_WRITE_KEY: ${{ secrets.AI_WRITE_KEY }}
          MAX_QUERIES: ${{ inputs.max_queries || '12' }}
        run: |
          set -euo pipefail
          : "${AI_WRITE_KEY:?Missing GitHub Secret AI_WRITE_KEY}"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 240 \
            --retry 2 --retry-delay 3 \
            -X POST \
            -H "X-AI-Key: ${AI_WRITE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"max_queries\":${MAX_QUERIES}}" \
            "https://7x.wz.cz/_kf/seed-worker.php" \
            | tee /tmp/seed-research-result.json

      - name: Download research files from the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          export FTP_PORT="${FTP_PORT:-21}"
          mkdir -p Install/seed_priprava/candidates

          python3 - <<'PY'
          import os
          def q(value):
              if "\n" in value or "\r" in value:
                  raise SystemExit("FTP settings must not contain newlines")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
          remote = os.environ["FTP_REMOTE_DIR"].rstrip("/")
          local = os.path.abspath("Install/seed_priprava")
          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              "set ftp:passive-mode yes",
              f"open -p {q(os.environ['FTP_PORT'])} {q(os.environ['FTP_SERVER'])}",
              f"user {q(os.environ['FTP_USERNAME'])} {q(os.environ['FTP_PASSWORD'])}",
              f"get -O {q(local)} {q(remote + '/Install/seed_priprava/band_queue.json')}",
              f"get -O {q(local)} {q(remote + '/Install/seed_priprava/automation_state.json')}",
              f"get -O {q(local + '/candidates')} {q(remote + '/Install/seed_priprava/candidates/search_results.jsonl')}",
              f"get -O {q(local + '/candidates')} {q(remote + '/Install/seed_priprava/candidates/search_queries.jsonl')}",
              "bye",
          ]
          with open("/tmp/kf-seed-import.lftp", "w", encoding="utf-8") as f:
              f.write("\n".join(commands) + "\n")
          PY
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -f /tmp/kf-seed-import.lftp
          rm -f /tmp/kf-seed-import.lftp

      - name: Commit research files to GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Install/seed_priprava/band_queue.json \
            Install/seed_priprava/automation_state.json \
            Install/seed_priprava/candidates/search_results.jsonl \
            Install/seed_priprava/candidates/search_queries.jsonl
          if git diff --cached --quiet; then
            echo "No research files changed."
            exit 0
          fi
          git commit -m "Save concert research search results"
          git push origin HEAD:main
