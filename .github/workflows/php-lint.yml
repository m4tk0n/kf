name: PHP syntax check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

# Syntax validation is independent of the FTP deployment workflow.

# Keep this workflow running on every main update.
