name: PHP syntax checks

on:
  push:
    branches:
      - main
      - auth-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './cache/*' -print0 | xargs -0 -n1 php -l
