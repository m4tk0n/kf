name: FTP to GitHub FULL

# Úplná náhrada obsahu main aktuálním obsahem FTP serveru.
# Spouští se výhradně ručně, aby nedošlo k nechtěnému přepsání GitHubu.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftp-github-full
  cancel-in-progress: false

jobs:
  full-import:
    name: Replace GitHub files with the live FTP website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download complete website from FTP into a clean staging directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing GitHub Secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing GitHub Secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing GitHub Secret FTP_PASSWORD}"
          : "${FTP_REMOTE_DIR:?Missing GitHub Secret FTP_REMOTE_DIR}"
          FTP_PORT="${FTP_PORT:-21}"

          mkdir -p /tmp/ftp-site

          # Build an lftp command file without printing credentials to the log.
          python3 - <<'PY'
          import os

          def quote(value):
              if "\\n" in value or "\\r" in value:
                  raise SystemExit("FTP settings must not contain newlines")
              return '"' + value.replace("\\\\", "\\\\\\\\").replace('"', '\\"') + '"'

          commands = [
              "set cmd:fail-exit yes",
              "set net:max-retries 2",
              "set net:timeout 30",
              "set ftp:passive-mode yes",
              f"open -p {quote(os.environ.get('FTP_PORT', '21'))} {quote(os.environ['FTP_SERVER'])}",
              f"user {quote(os.environ['FTP_USERNAME'])} {quote(os.environ['FTP_PASSWORD'])}",
              # Download all website content, including hidden files, runtime data,
              # uploaded images and cron files. Never copy secrets or Git metadata.
              "mirror --verbose --parallel=2 "
              "--exclude-glob .env --exclude-glob '.env.*' "
              "--exclude-glob .git --exclude-glob '.git/**' "
              "--exclude-glob .github --exclude-glob '.github/**' "
              f"{quote(os.environ['FTP_REMOTE_DIR'])} /tmp/ftp-site",
              "bye",
          ]
          with open("/tmp/ftp-full-import.lftp", "w", encoding="utf-8") as f:
              f.write("\\n".join(commands) + "\\n")
          PY

          lftp -f /tmp/ftp-full-import.lftp
          rm -f /tmp/ftp-full-import.lftp

          # Safety checks: never wipe GitHub if FTP was empty or the target is wrong.
          if [ ! -s /tmp/ftp-site/index.php ]; then
            echo "FTP download has no root index.php; refusing to replace GitHub."
            exit 1
          fi

          FILE_COUNT="$(find /tmp/ftp-site -type f | wc -l)"
          if [ "$FILE_COUNT" -lt 5 ]; then
            echo "Only $FILE_COUNT files were downloaded; refusing a suspiciously small import."
            exit 1
          fi
          echo "Verified FTP download: $FILE_COUNT files."

      - name: Delete all existing GitHub website files and replace them with FTP content
        run: |
          set -euo pipefail

          # Keep Git metadata and this workflow so the import can finish and be run again.
          # Everything else in the repository root is replaced by the FTP copy.
          find . -mindepth 1 -maxdepth 1 \\
            ! -name '.git' \\
            ! -name '.github' \\
            -exec rm -rf -- {} +

          cp -a /tmp/ftp-site/. .
          rm -rf /tmp/ftp-site

          # Environment files are intentionally never imported or committed.
          rm -f .env
          find . -maxdepth 1 -type f -name '.env.*' -delete

          git add -A -- . \\
            ':(exclude).env' \\
            ':(exclude).env/**' \\
            ':(exclude).env.*' \\
            ':(exclude).env.*/**' \\
            ':(exclude).github' \\
            ':(exclude).github/**' \\
            ':(exclude).ftp-deploy-sync-state.json'

          if git diff --cached --quiet; then
            echo "FTP content is already identical to GitHub."
            exit 0
          fi

          echo "Files staged for full replacement:"
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[skip ci] Full replacement from live FTP server"
          git push origin HEAD:main
